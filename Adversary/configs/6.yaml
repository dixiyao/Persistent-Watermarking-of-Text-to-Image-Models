# Table 3, row 6: Personalization / 5x LoRA.
# No separate stage - the transformation is applied at decode time by
# the evaluation harness, through the flags below.
index: 6
name: "personalization_5x_lora"
paper:
  table: 3
  row: 6
  modification: "Personalization"
  algorithm: "5x LoRA"
  dataset: "DreamBooth"
  rounds: "1K x 5"
  learning_rate: "1e-4"
driver: null
requires_two_models: false
transform_only: false
standalone_args: true
args: {}
flags: []
stages:
  - name: "stage_01_backpack"
    script: "train_dreambooth_continue_personalization.py"
    args:
      instance_data_dir: "${DREAMBOOTH_ROOT}/backpack"
      class_data_dir: "${OUT}/class_images/backpack"
      instance_prompt: "a sks0 backpack"
      class_prompt: "a backpack"
      personalization_integrity_prompt: "a sks0 backpack"
      resolution: 512
      train_batch_size: 1
      learning_rate: "1e-4"
      rank: 16
      lora_alpha: 32
      step: 1000
      integrity_interval: 50
      checkpointing_steps: 250
      checkpoints_total_limit: 4
    flags:
      - "--save_merged_final"
