    resume_from: "stage_02_naruto"
    args:
      data_dir: "${COCO_DATASET}"
      learning_rate: "1e-4"
      max_train_steps: 15000
      integrity_interval: 750
      checkpointing_steps: 750
      checkpoints_total_limit: 20
      te_lora_target_modules: ""
