# Table 3, row 4: Sequential / LoRA.
index: 4
name: "sequential"
paper:
  table: 3
  row: 4
  modification: "Sequential"
  algorithm: "LoRA"
  dataset: "3 Datasets"
  rounds: "15K x 3"
  learning_rate: "1e-4"
driver: null
requires_two_models: false
transform_only: false
standalone_args: false
args: {}
flags: []
stages:
  - name: "stage_01_pokemon"
    script: "train_dreambooth_continue_styletransfer_pokemon.py"
